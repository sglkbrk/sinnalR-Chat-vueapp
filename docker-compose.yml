services:
  web:
    build: .
    container_name: productmanagement-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5044:5044"   # HTTPS/HTTP port eşlemesi
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: "http://+:5044"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST};Database=${MYSQL_DATABASE};User=${DB_USER};Password=${DB_PASSWORD}"
      Minio__Endpoint: "${MINIO_ENDPOINT}"
      Minio__AccessKey: "${MINIO_ACCESS_KEY}"
      Minio__SecretKey: "${MINIO_SECRET_KEY}"
      Jwt__Key: "${JWT_KEY}"
    networks:
      - app-network

networks:
  app-network:
    external: true
